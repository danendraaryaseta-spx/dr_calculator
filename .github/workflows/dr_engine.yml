name: DR Engine

on:
  schedule:
    - cron: '0 */6 * * *'    # every 6 hours
  workflow_dispatch:           # manual trigger button

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread google-auth pandas numpy

      - name: Run DR engine
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python dr_engine.py

      - name: Commit and push results
        run: |
          git config user.name "DR Engine Bot"
          git config user.email "bot@dr-engine"
          git add dr_results.json
          git diff --cached --quiet || git commit -m "update DR results $(date -u +%Y-%m-%d\ %H:%M)"
          git push
